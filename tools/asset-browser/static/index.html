<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pirate Nation Art Browser</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    :root {
      --bg: #12161c;
      --panel: #1a212b;
      --panel-2: #232c38;
      --ink: #e8eef6;
      --muted: #93a0b4;
      --line: #314053;
      --accent: #d4a24c;
      --accent-ink: #1a1408;
      --danger: #c45c5c;
      --radius: 10px;
      --gap: 12px;
      --sidebar: 280px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 10% -10%, #243247 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #2a2216 0%, transparent 45%),
        var(--bg);
      font: 14px/1.45 "Segoe UI", system-ui, sans-serif;
    }

    .app {
      display: grid;
      grid-template-columns: var(--sidebar) 1fr;
      height: 100%;
      min-height: 0;
    }

    aside {
      border-right: 1px solid var(--line);
      background: color-mix(in srgb, var(--panel) 92%, black);
      padding: 18px 14px;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    h1 {
      margin: 0;
      font-size: 1.05rem;
      letter-spacing: 0.02em;
      color: var(--accent);
      font-weight: 650;
    }

    .sub {
      color: var(--muted);
      font-size: 12px;
      margin-top: 4px;
    }

    label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 6px;
    }

    input[type="search"], select {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--ink);
      border-radius: 8px;
      padding: 8px 10px;
      outline: none;
    }
    input[type="search"]:focus, select:focus {
      border-color: color-mix(in srgb, var(--accent) 70%, var(--line));
    }

    .kinds {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .kinds button {
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--muted);
      border-radius: 999px;
      padding: 5px 10px;
      cursor: pointer;
    }
    .kinds button.active {
      color: var(--accent-ink);
      background: var(--accent);
      border-color: var(--accent);
    }

    .cats {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-height: 0;
    }
    .cat {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      width: 100%;
      text-align: left;
      border: 0;
      background: transparent;
      color: var(--ink);
      border-radius: 8px;
      padding: 7px 8px;
      cursor: pointer;
    }
    .cat:hover { background: var(--panel-2); }
    .cat.active {
      background: color-mix(in srgb, var(--accent) 18%, var(--panel-2));
      color: #f3e2b8;
    }
    .cat span:last-child {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      font-size: 12px;
    }

    main {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--panel) 80%, transparent);
      backdrop-filter: blur(8px);
      position: sticky;
      top: 0;
      z-index: 2;
    }
    .toolbar .meta { color: var(--muted); font-size: 13px; }
    .toolbar .nav { display: flex; gap: 8px; }
    .toolbar button, .lightbox button {
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--ink);
      border-radius: 8px;
      padding: 7px 12px;
      cursor: pointer;
    }
    .toolbar button:disabled { opacity: 0.4; cursor: default; }

    .grid-wrap {
      overflow: auto;
      padding: 16px;
      min-height: 0;
      flex: 1;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: var(--gap);
    }

    .card {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      min-height: 190px;
      transition: border-color 120ms ease, transform 120ms ease;
    }
    .card:hover {
      border-color: color-mix(in srgb, var(--accent) 55%, var(--line));
      transform: translateY(-1px);
    }
    .thumb {
      aspect-ratio: 1;
      background:
        linear-gradient(45deg, #1b2230 25%, transparent 25%),
        linear-gradient(-45deg, #1b2230 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #1b2230 75%),
        linear-gradient(-45deg, transparent 75%, #1b2230 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0;
      background-color: #151b24;
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    .thumb img, .thumb video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: #0e1218;
    }
    .thumb .badge {
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--line));
      padding: 6px 8px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--panel) 70%, transparent);
    }
    .caption {
      padding: 8px 10px 10px;
      border-top: 1px solid var(--line);
    }
    .caption .name {
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .caption .path {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .empty, .status {
      color: var(--muted);
      padding: 48px 16px;
      text-align: center;
    }
    .status.error { color: var(--danger); }

    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(6, 8, 12, 0.86);
      display: none;
      place-items: center;
      padding: 24px;
      z-index: 20;
    }
    .lightbox.open { display: grid; }
    .lightbox-inner {
      width: min(1100px, 100%);
      height: min(820px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
    }
    .lightbox-head, .lightbox-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
    }
    .lightbox-foot { border-bottom: 0; border-top: 1px solid var(--line); }
    .lightbox-head strong {
      font-size: 13px;
      word-break: break-all;
    }
    .stage {
      min-height: 0;
      display: grid;
      place-items: center;
      background: #0c1016;
      padding: 12px;
    }
    .stage img, .stage video {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    model-viewer {
      width: 100%;
      height: 100%;
      background: #0c1016;
      --poster-color: transparent;
    }

    @media (max-width: 860px) {
      .app { grid-template-columns: 1fr; }
      aside { max-height: 42vh; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div>
        <h1>Pirate Assets Browser</h1>
        <div class="sub" id="rootPath">Indexing…</div>
      </div>

      <div>
        <label for="q">Search</label>
        <input id="q" type="search" placeholder="name or path…" />
      </div>

      <div>
        <label>Type</label>
        <div class="kinds" id="kinds">
          <button type="button" data-kind="" class="active">All</button>
          <button type="button" data-kind="image">Image</button>
          <button type="button" data-kind="video">Video</button>
          <button type="button" data-kind="model">3D</button>
        </div>
      </div>

      <div>
        <label>Category</label>
        <div class="cats" id="cats"></div>
      </div>
    </aside>

    <main>
      <div class="toolbar">
        <div class="meta" id="meta">Loading…</div>
        <div class="nav">
          <button type="button" id="prev">Previous</button>
          <button type="button" id="next">Next</button>
        </div>
      </div>
      <div class="grid-wrap">
        <div class="status" id="status">Building index…</div>
        <div class="grid" id="grid" hidden></div>
      </div>
    </main>
  </div>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <div class="lightbox-inner">
      <div class="lightbox-head">
        <strong id="lbTitle"></strong>
        <button type="button" id="lbClose">Close</button>
      </div>
      <div class="stage" id="lbStage"></div>
      <div class="lightbox-foot">
        <div class="meta" id="lbMeta"></div>
        <a id="lbOpen" href="#" target="_blank" rel="noreferrer">Open file URL</a>
      </div>
    </div>
  </div>

  <script>
    const state = {
      category: "",
      kind: "",
      q: "",
      offset: 0,
      limit: 72,
      total: 0,
      items: [],
    };

    const els = {
      rootPath: document.getElementById("rootPath"),
      cats: document.getElementById("cats"),
      kinds: document.getElementById("kinds"),
      q: document.getElementById("q"),
      meta: document.getElementById("meta"),
      status: document.getElementById("status"),
      grid: document.getElementById("grid"),
      prev: document.getElementById("prev"),
      next: document.getElementById("next"),
      lightbox: document.getElementById("lightbox"),
      lbTitle: document.getElementById("lbTitle"),
      lbStage: document.getElementById("lbStage"),
      lbMeta: document.getElementById("lbMeta"),
      lbOpen: document.getElementById("lbOpen"),
      lbClose: document.getElementById("lbClose"),
    };

    const fileUrl = (path) => `/files/${path.split("/").map(encodeURIComponent).join("/")}`;

    async function waitReady() {
      for (;;) {
        const res = await fetch("/api/status");
        const data = await res.json();
        els.rootPath.textContent = data.assetsRoot || "";
        if (data.error) {
          els.status.classList.add("error");
          els.status.textContent = data.error;
          return false;
        }
        if (data.ready) {
          els.status.textContent = `Indexed ${data.count.toLocaleString()} viewable files`;
          return true;
        }
        els.status.textContent = `Indexing… ${data.count.toLocaleString()} so far`;
        await new Promise((r) => setTimeout(r, 400));
      }
    }

    async function loadCategories() {
      const res = await fetch("/api/categories");
      const data = await res.json();
      const all = document.createElement("button");
      all.className = "cat active";
      all.dataset.category = "";
      all.innerHTML = `<span>All</span><span>${data.total.toLocaleString()}</span>`;
      els.cats.replaceChildren(all);

      for (const cat of data.categories) {
        const btn = document.createElement("button");
        btn.className = "cat";
        btn.dataset.category = cat.name;
        btn.innerHTML = `<span>${cat.name}</span><span>${cat.count.toLocaleString()}</span>`;
        els.cats.appendChild(btn);
      }
    }

    async function loadAssets() {
      const params = new URLSearchParams({
        offset: String(state.offset),
        limit: String(state.limit),
      });
      if (state.category) params.set("category", state.category);
      if (state.kind) params.set("kind", state.kind);
      if (state.q) params.set("q", state.q);

      const res = await fetch(`/api/assets?${params}`);
      const data = await res.json();
      state.total = data.total;
      state.items = data.items;

      const start = state.total ? state.offset + 1 : 0;
      const end = Math.min(state.offset + state.limit, state.total);
      els.meta.textContent = `${start}–${end} of ${state.total.toLocaleString()}`;
      els.prev.disabled = state.offset <= 0;
      els.next.disabled = state.offset + state.limit >= state.total;

      if (!state.items.length) {
        els.grid.hidden = true;
        els.status.hidden = false;
        els.status.classList.remove("error");
        els.status.textContent = "No assets match these filters.";
        return;
      }

      els.status.hidden = true;
      els.grid.hidden = false;
      els.grid.replaceChildren(
        ...state.items.map((item) => {
          const card = document.createElement("button");
          card.type = "button";
          card.className = "card";
          card.title = item.path;

          const thumb = document.createElement("div");
          thumb.className = "thumb";
          const src = fileUrl(item.path);

          if (item.kind === "image") {
            const img = document.createElement("img");
            img.loading = "lazy";
            img.src = src;
            img.alt = item.name;
            img.addEventListener("error", () => {
              thumb.replaceChildren();
              const badge = document.createElement("div");
              badge.className = "badge";
              badge.textContent = "missing / LFS";
              thumb.appendChild(badge);
            });
            thumb.appendChild(img);
          } else if (item.kind === "video") {
            const video = document.createElement("video");
            video.src = src;
            video.muted = true;
            video.loop = true;
            video.playsInline = true;
            video.preload = "metadata";
            card.addEventListener("mouseenter", () => video.play().catch(() => {}));
            card.addEventListener("mouseleave", () => {
              video.pause();
              video.currentTime = 0;
            });
            thumb.appendChild(video);
          } else if (item.preview) {
            const img = document.createElement("img");
            img.loading = "lazy";
            img.src = fileUrl(item.preview);
            img.alt = item.name;
            thumb.appendChild(img);
          } else {
            const badge = document.createElement("div");
            badge.className = "badge";
            badge.textContent = "glTF 3D";
            thumb.appendChild(badge);
          }

          const caption = document.createElement("div");
          caption.className = "caption";
          caption.innerHTML = `
            <div class="name">${escapeHtml(item.name)}</div>
            <div class="path">${escapeHtml(item.path)}</div>
          `;

          card.append(thumb, caption);
          card.addEventListener("click", () => openLightbox(item));
          return card;
        })
      );
    }

    function escapeHtml(s) {
      return s
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function openLightbox(item) {
      const src = fileUrl(item.path);
      els.lbTitle.textContent = item.path;
      els.lbMeta.textContent = `${item.kind} · ${item.category}`;
      els.lbOpen.href = src;
      els.lbStage.replaceChildren();

      const fail = (detail) => {
        const p = document.createElement("p");
        p.style.cssText = "color:#c45c5c;max-width:36rem;text-align:center;padding:1rem;";
        p.textContent = detail;
        els.lbStage.appendChild(p);
      };

      if (item.kind === "image") {
        const img = document.createElement("img");
        img.src = src;
        img.alt = item.name;
        img.addEventListener("error", () => {
          els.lbStage.replaceChildren();
          fail("Image failed to load. Often this means the file is still a Git LFS pointer (not downloaded).");
        });
        els.lbStage.appendChild(img);
      } else if (item.kind === "video") {
        const video = document.createElement("video");
        video.src = src;
        video.controls = true;
        video.autoplay = true;
        video.loop = true;
        video.addEventListener("error", () => {
          els.lbStage.replaceChildren();
          fail("Video failed to load. Often this means the file is still a Git LFS pointer (not downloaded).");
        });
        els.lbStage.appendChild(video);
      } else {
        const viewer = document.createElement("model-viewer");
        viewer.setAttribute("src", src);
        viewer.setAttribute("camera-controls", "");
        viewer.setAttribute("touch-action", "pan-y");
        viewer.setAttribute("auto-rotate", "");
        viewer.setAttribute("shadow-intensity", "0.6");
        viewer.setAttribute("exposure", "1.1");
        viewer.addEventListener("error", () => {
          els.lbStage.replaceChildren();
          fail("3D model failed to load. Ship glTFs are stored in Git LFS — pull LFS assets, then re-sync.");
        });
        els.lbStage.appendChild(viewer);
      }

      els.lightbox.classList.add("open");
      els.lightbox.setAttribute("aria-hidden", "false");
    }

    function closeLightbox() {
      els.lightbox.classList.remove("open");
      els.lightbox.setAttribute("aria-hidden", "true");
      els.lbStage.replaceChildren();
    }

    els.cats.addEventListener("click", (e) => {
      const btn = e.target.closest(".cat");
      if (!btn) return;
      state.category = btn.dataset.category || "";
      state.offset = 0;
      els.cats.querySelectorAll(".cat").forEach((el) => el.classList.toggle("active", el === btn));
      loadAssets();
    });

    els.kinds.addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-kind]");
      if (!btn) return;
      state.kind = btn.dataset.kind || "";
      state.offset = 0;
      els.kinds.querySelectorAll("button").forEach((el) => el.classList.toggle("active", el === btn));
      loadAssets();
    });

    let searchTimer;
    els.q.addEventListener("input", () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        state.q = els.q.value.trim();
        state.offset = 0;
        loadAssets();
      }, 200);
    });

    els.prev.addEventListener("click", () => {
      state.offset = Math.max(0, state.offset - state.limit);
      loadAssets();
    });
    els.next.addEventListener("click", () => {
      if (state.offset + state.limit < state.total) {
        state.offset += state.limit;
        loadAssets();
      }
    });

    els.lbClose.addEventListener("click", closeLightbox);
    els.lightbox.addEventListener("click", (e) => {
      if (e.target === els.lightbox) closeLightbox();
    });
    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeLightbox();
    });

    (async () => {
      const ok = await waitReady();
      if (!ok) return;
      await loadCategories();
      await loadAssets();
    })();
  </script>
</body>
</html>
