<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#EDF1F2; --surface:#F8FAFB; --sunk:#E3E9EC; --ink:#13212C; --muted:#56697A; --faint:#7C8D9B;
  --rule:#C9D3D9; --rule-strong:#A9B7C0;
  --brass:#8F6210; --brass-bg:#F1E6CF; --brass-line:#D9BE86;
  --sea:#1C6770; --sea-bg:#D7E9EB; --sea-line:#9CC7CC;
  --ok:#2E7A4C; --ok-bg:#DCEEE2; --warn:#9A5B12; --warn-bg:#F5E7D2; --crit:#A83838; --crit-bg:#F6DEDE;
  --k-i:#1C6770; --k-g:#6B4FA0; --k-n:#8F6210; --k-t:#2E7A4C; --k-c:#6E7F8D;
  --bar-legacy:#B9C6CE; --bar-adapter:#8FC0C6; --bar-state2:#D9BE86; --bar-state3:#DDBDBD;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,"Courier New",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0C1620; --surface:#122130; --sunk:#0F1C28; --ink:#DCE6EC; --muted:#98AAB8; --faint:#71849A;
    --rule:#233748; --rule-strong:#34506A;
    --brass:#D9A548; --brass-bg:#35290F; --brass-line:#6B5220;
    --sea:#62B8C1; --sea-bg:#12313A; --sea-line:#285A62;
    --ok:#6CC08E; --ok-bg:#15301F; --warn:#E0A058; --warn-bg:#35240F; --crit:#E57C7C; --crit-bg:#3A1818;
    --k-i:#62B8C1; --k-g:#A98FE0; --k-n:#D9A548; --k-t:#6CC08E; --k-c:#8FA1B3;
    --bar-legacy:#3A4E60; --bar-adapter:#2B6A73; --bar-state2:#6B5220; --bar-state3:#5A2E2E;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0C1620; --surface:#122130; --sunk:#0F1C28; --ink:#DCE6EC; --muted:#98AAB8; --faint:#71849A;
  --rule:#233748; --rule-strong:#34506A;
  --brass:#D9A548; --brass-bg:#35290F; --brass-line:#6B5220;
  --sea:#62B8C1; --sea-bg:#12313A; --sea-line:#285A62;
  --ok:#6CC08E; --ok-bg:#15301F; --warn:#E0A058; --warn-bg:#35240F; --crit:#E57C7C; --crit-bg:#3A1818;
  --k-i:#62B8C1; --k-g:#A98FE0; --k-n:#D9A548; --k-t:#6CC08E; --k-c:#8FA1B3;
  --bar-legacy:#3A4E60; --bar-adapter:#2B6A73; --bar-state2:#6B5220; --bar-state3:#5A2E2E;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:24px}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;padding-inline:20px;padding-block:0 72px}
a{color:var(--sea);text-decoration-thickness:1px;text-underline-offset:2px}
a:focus-visible,button:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:3px}
code{font-family:var(--f-mono);font-size:.85em;background:var(--sunk);border:1px solid var(--rule);border-radius:4px;padding:0 .3em;overflow-wrap:anywhere}
pre{font-family:var(--f-mono);font-size:13px;line-height:1.55;background:var(--sunk);border:1px solid var(--rule);border-radius:8px;padding:14px 16px;overflow-x:auto;margin:0}
pre code{background:none;border:0;padding:0;white-space:pre;overflow-wrap:normal}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;line-height:1.1;text-wrap:balance;margin:0}
h2{font-size:34px}
h3{font-size:26px}
h4{font-size:14.5px;font-family:var(--f-body);font-weight:600;letter-spacing:.01em}
p{margin:0}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}

/* shell */
.shell{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:220px minmax(0,1fr);gap:44px}
.main{min-width:0;display:flex;flex-direction:column;gap:64px;max-width:900px}
.nav{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;max-height:100vh;overflow-y:auto;padding-block:28px 24px}
.nav h4{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:500;margin:18px 0 6px 8px}
.nav ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
.nav a{display:flex;gap:10px;align-items:baseline;text-decoration:none;color:var(--muted);font-size:13.5px;padding:4px 8px;border-radius:5px;border-left:2px solid transparent}
.nav a:hover{color:var(--ink);background:var(--sunk)}
.nav a.on{color:var(--ink);border-left-color:var(--brass);background:var(--surface)}
.nav .code{font-family:var(--f-display);font-weight:600;font-size:15px;color:var(--sea);min-width:30px}
.nav .brand{font-family:var(--f-display);font-size:20px;font-weight:700;color:var(--ink);padding-left:8px}

/* masthead */
.masthead{padding-block:40px 28px;display:flex;flex-direction:column;gap:18px;border-bottom:1px solid var(--rule)}
.masthead h1{font-size:clamp(40px,6vw,62px);font-weight:700}
.masthead .lede{font-size:17px;max-width:66ch}
.status{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--warn);background:var(--warn-bg);border:1px solid var(--brass-line);border-radius:999px;padding:3px 12px;width:max-content;max-width:100%}
.status::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--warn)}
.status.ok{color:var(--ok);background:var(--ok-bg);border-color:transparent}
.status.ok::before{background:var(--ok)}
.progress{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:4px}
.progress span{height:10px;border-radius:3px;background:var(--sunk);border:1px solid var(--rule)}
.progress span.done{background:var(--ok);border-color:var(--ok)}
.progress span.next{background:var(--brass-bg);border-color:var(--brass)}
.progress-lbl{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-top:4px}
.results{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:720px){.results{grid-template-columns:minmax(0,1fr)}}
.route li.done .wp{color:var(--ok)}
.route li.done .wp::after{background:var(--ok);border-color:var(--ok)}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--rule);border-radius:10px;background:var(--surface);overflow:hidden;margin:0}
.facts div{padding:12px 14px;border-right:1px solid var(--rule);display:flex;flex-direction:column;gap:2px}
.facts div:last-child{border-right:0}
.facts dt{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.facts dd{margin:0;font-weight:600;font-size:14.5px}

/* sections */
section.block{display:flex;flex-direction:column;gap:20px}
.sec-head{display:flex;flex-direction:column;gap:6px}
.sec-head p{color:var(--muted);max-width:68ch}
.prose{display:flex;flex-direction:column;gap:12px;max-width:72ch}
.callout{border:1px solid var(--sea-line);background:var(--sea-bg);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.callout.brass{border-color:var(--brass-line);background:var(--brass-bg)}
ul.tight,ol.tight{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
ul.tight li::marker{color:var(--faint)}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:11.5px;line-height:1;padding:4px 7px;border-radius:5px;border:1px solid var(--rule);background:var(--surface);color:var(--muted);white-space:nowrap}
.chip.ok{color:var(--ok);background:var(--ok-bg);border-color:transparent}
.chip.moved{color:var(--brass);background:var(--brass-bg);border-color:var(--brass-line)}
.chip.sea{color:var(--sea);background:var(--sea-bg);border-color:var(--sea-line)}
.chip.crit{color:var(--crit);background:var(--crit-bg);border-color:transparent}

/* decisions */
.decisions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.dec{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.dec header{display:flex;align-items:center;gap:10px}
.dec .id{font-family:var(--f-display);font-size:20px;font-weight:700;color:var(--sea);min-width:30px}
.dec h4{flex:1}
.dec p{font-size:14px;color:var(--muted)}
.dec p strong{color:var(--ink);font-weight:600}

/* route */
.route{list-style:none;margin:0;padding:0;position:relative}
.route::before{content:"";position:absolute;left:31px;top:18px;bottom:18px;border-left:2px dashed var(--rule-strong)}
.route li{position:relative;display:grid;grid-template-columns:64px minmax(0,1fr);gap:16px;padding:9px 0}
.route .wp{position:relative;z-index:1;width:64px;height:34px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--sea);background:var(--paper)}
.route .wp::after{content:"";position:absolute;right:-8px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:var(--surface);border:2px solid var(--sea)}
.route li.gated .wp::after{background:var(--brass);border-color:var(--brass)}
.route .body{display:flex;flex-direction:column;gap:3px;padding-top:4px}
.route .title{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.route .title a{font-weight:600;color:var(--ink);text-decoration:none}
.route .title a:hover{text-decoration:underline}
.route .why{font-size:14px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:13px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:7px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;border:2px solid var(--sea);background:var(--surface)}
.dot.b{background:var(--brass);border-color:var(--brass)}
.swatch{width:22px;height:10px;border-radius:3px;display:inline-block}

/* layers */
.layers{display:flex;flex-direction:column;gap:6px}
.layer{display:grid;grid-template-columns:160px minmax(0,1fr);background:var(--surface);border:1px solid var(--rule);border-radius:9px;overflow:hidden}
.layer .name{padding:10px 12px;font-family:var(--f-display);font-weight:600;font-size:17px;background:var(--sunk);border-right:1px solid var(--rule);display:flex;flex-direction:column;gap:2px;justify-content:center}
.layer .name small{font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--muted)}
.layer .items{padding:10px 12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.layer-arrow{font-family:var(--f-mono);font-size:12px;color:var(--faint);padding-left:168px}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--rule);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;vertical-align:top;padding:9px 12px;border-bottom:1px solid var(--rule)}
th{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;background:var(--sunk);position:sticky;top:0}
tr:last-child td{border-bottom:0}
td.nowrap{white-space:nowrap}

/* sequence */
.seq{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.seq span.step{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:4px 9px}
.seq span.arr{color:var(--faint)}

/* lifetime chart */
.gantt-wrap{overflow-x:auto;border:1px solid var(--rule);border-radius:10px;background:var(--surface);padding:12px 12px 14px}
.gantt{display:grid;grid-template-columns:minmax(190px,1.4fr) repeat(16,minmax(26px,1fr));row-gap:6px;min-width:760px;font-size:12.5px;align-items:center}
.gantt .hd{font-family:var(--f-display);font-weight:600;font-size:13px;color:var(--muted);text-align:center;padding-bottom:4px;border-bottom:1px solid var(--rule)}
.gantt .hd.lbl{text-align:left}
.gantt .lbl{grid-column:1;padding-right:10px;line-height:1.3}
.gantt .lbl code{font-size:11.5px}
.gantt .grp{grid-column:1 / -1;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);padding-top:10px}
.gantt .bar{height:16px;border-radius:4px;background:var(--bar-legacy);position:relative}
.gantt .bar.ad{background:var(--bar-adapter)}
.gantt .bar.s2{background:var(--bar-state2)}
.gantt .bar.s3{background:var(--bar-state3)}
.gantt .bar span{position:absolute;left:6px;top:50%;transform:translateY(-50%);font-size:10.5px;white-space:nowrap;color:var(--ink)}
.gantt .end{height:16px;display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;color:var(--crit)}
.todos h3{margin-top:18px}.todos h4{margin:16px 0 6px}.todos ul.todo{list-style:none;padding-left:0}.todos ul.todo li{margin:6px 0}.todos .box{font-size:15px;margin-right:4px}
</style>
<style>
/* phases */
.phase{display:flex;flex-direction:column;gap:16px;padding-top:6px}
.phase-head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 16px;align-items:center}
.phase-code{grid-row:span 2;font-family:var(--f-display);font-weight:700;font-size:54px;line-height:.9;color:var(--sea);min-width:76px}
.phase-head .meta{display:flex;flex-wrap:wrap;gap:6px}
.goal{font-size:15.5px;max-width:72ch}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border:1px solid var(--rule);border-radius:10px;background:var(--surface)}
.tasks li{display:grid;grid-template-columns:62px minmax(0,1fr);gap:12px;padding:10px 14px;border-bottom:1px solid var(--rule);font-size:14px}
.tasks li:last-child{border-bottom:0}
.tid{font-family:var(--f-mono);font-size:12px;font-weight:500;padding-top:2px;color:var(--k-c);white-space:nowrap}
.tid.i{color:var(--k-i)} .tid.g{color:var(--k-g)} .tid.n{color:var(--k-n)} .tid.t{color:var(--k-t)} .tid.c{color:var(--k-c)}
.tasks li strong{font-weight:600}
.kinds{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--muted)}
.kinds span{display:inline-flex;gap:6px;align-items:center}
.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.check{border:1px solid var(--rule);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:14px;background:var(--surface)}
.check h4{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500}
.check.you{border-color:var(--brass-line);background:var(--brass-bg)}
.check.done{border-color:var(--sea-line)}
.check.diff{grid-column:1 / -1}
.divider{border:0;border-top:1px solid var(--rule);margin:8px 0 0}

/* protocol */
.protocol{list-style:none;counter-reset:p;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.protocol li{counter-increment:p;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:12px 14px 12px 50px;position:relative;font-size:14px}
.protocol li::before{content:counter(p);position:absolute;left:14px;top:9px;font-family:var(--f-display);font-weight:700;font-size:22px;color:var(--sea)}
.protocol li.gate{border-color:var(--brass-line);background:var(--brass-bg)}
.protocol li.gate::before{color:var(--brass)}
.copyrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
button.btn{font:inherit;font-size:13px;border:1px solid var(--rule-strong);background:var(--surface);color:var(--ink);border-radius:6px;padding:5px 11px;cursor:pointer}
button.btn:hover{background:var(--sunk)}

/* register */
.filters{display:flex;flex-wrap:wrap;gap:6px}
.filters button{font-family:var(--f-mono);font-size:12px;border:1px solid var(--rule);background:var(--surface);color:var(--muted);border-radius:999px;padding:4px 11px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--sea);border-color:var(--sea);color:var(--paper)}
.rid{font-family:var(--f-mono);font-size:12px;white-space:nowrap;color:var(--sea)}
.foot{border-top:1px solid var(--rule);padding-top:20px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:6px}

@media (max-width:1000px){
  .shell{grid-template-columns:minmax(0,1fr);gap:0}
  .nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;max-height:none;overflow:visible;padding-block:10px;background:var(--paper);border-bottom:1px solid var(--rule);margin-inline:-20px;padding-inline:20px}
  .nav .brand,.nav h4{display:none}
  .nav .navlists{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin}
  .nav ol{flex-direction:row;gap:4px}
  .nav a{white-space:nowrap;border-left:0;border-bottom:2px solid transparent;border-radius:5px 5px 0 0}
  .nav a.on{border-bottom-color:var(--brass)}
  .nav .code{min-width:0}
  .nav .lab{display:none}
  .main{gap:52px}
}
@media (max-width:720px){
  h2{font-size:30px}
  .facts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .facts div:nth-child(2){border-right:0}
  .facts div:nth-child(-n+2){border-bottom:1px solid var(--rule)}
  .decisions,.checks,.protocol{grid-template-columns:minmax(0,1fr)}
  .layer{grid-template-columns:minmax(0,1fr)}
  .layer .name{border-right:0;border-bottom:1px solid var(--rule)}
  .layer-arrow{padding-left:12px}
  .phase-code{font-size:42px;min-width:60px}
  .tasks li{grid-template-columns:minmax(0,1fr);gap:2px}
}
</style>
