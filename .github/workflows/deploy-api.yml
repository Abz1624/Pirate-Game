# Server tests on every push that touches server/. Deploys are manual (owner, 6 Oct): the agent runs
# `server/deploy.ps1` with the project token from the uncommitted .env when a server change needs to go live.
name: Server tests

on:
  push:
    paths: ['server/**', '.github/workflows/deploy-api.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Server tests
        run: dotnet test server/RoguePirates.Api.Tests --nologo
