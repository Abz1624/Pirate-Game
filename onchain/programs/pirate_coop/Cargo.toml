[package]
name = "pirate_coop"
version.workspace = true
description = "Pirate Game co-op match program with MagicBlock ER delegation"
edition.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "pirate_coop"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
# Exact pin: newer 0.2.x pulls Anchor 1.x
ephemeral-rollups-sdk = { version = "=0.2.1", features = ["anchor"] }
pirate-sim = { path = "../../crates/sim", default-features = false, features = ["bpf"] }
